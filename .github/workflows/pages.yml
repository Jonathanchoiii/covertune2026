name: Deploy CoverTune to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "demo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: demo
        run: npm ci --no-audit --no-fund

      - name: Verify protected runtime
        working-directory: demo
        run: npm run check:runtime

      - name: Type-check
        working-directory: demo
        run: npm exec tsc -- --noEmit

      - name: Build for repository Pages path
        working-directory: demo
        run: npm exec vite -- build --base=/covertune2026/ --outDir=dist-pages

      - name: Rewrite public asset paths
        working-directory: demo
        run: node scripts/prepare-github-pages.mjs dist-pages /covertune2026 "$GITHUB_SHA"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
