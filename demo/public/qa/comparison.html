<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoverTune Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #171717;
        color: #fff;
        font: 600 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: flex;
        gap: 24px;
        justify-content: center;
        padding: 24px;
      }
      figure { margin: 0; }
      figcaption {
        margin-bottom: 10px;
        color: #d8d8d8;
        letter-spacing: .04em;
      }
      img {
        display: block;
        width: 393px;
        height: 852px;
        border-radius: 22px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>SELECTED SOURCE</figcaption>
        <img src="/qa/source.png" alt="Selected source design" />
      </figure>
      <figure>
        <figcaption>IMPLEMENTATION · JON · SEED 0</figcaption>
        <img src="/qa/implementation.jpg" alt="CoverTune implementation" />
      </figure>
    </main>
  </body>
</html>
